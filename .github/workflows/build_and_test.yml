name: Build and publish image to Docker Hub
on:
  push:
    branches:
      - '**'

jobs:
  publish-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kkittur/drivebrain_cross_compile:latest .

      - name: Push image to Docker Hub
        run: |
          docker login -u kkittur -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker push kkittur/drivebrain_cross_compile:latest

  build-executable:
    needs: publish-image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conan-packages
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'requirements.txt', 'conanfile.py', 'rpi_profile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'requirements.txt', 'conanfile.py', 'rpi_profile') }}-
            conan-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Conan package directory
        run: mkdir -p "$RUNNER_TEMP/conan-packages"

      - name: Pull from container registry
        run: |
          docker pull kkittur/drivebrain_cross_compile:latest

      - name: Enter container and build
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        run: |
          docker compose run --rm \
            -v "$RUNNER_TEMP/conan-packages:/root/.conan2/p" \
            -e ARTIFACTORY_TOKEN \
            -e ARTIFACTORY_URL \
            -e ARTIFACTORY_USERNAME \
            dev ./scripts/build_script.sh --jetson

      - name: Fix Conan cache ownership
        if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/conan-packages"

      - name: Save Conan packages
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/conan-packages
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      - name: Extract binary from build
        run: |
          docker compose run --rm dev cp build-arm/drivebrain /app/drivebrain-arm

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: drivebrain-arm-binary
          path: drivebrain-arm

  create-release:
    needs: [publish-image, build-executable]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v[0-9]*' | sort -t'v' -k2 -n | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1"
          else
            NUM=${LATEST#v}
            NEXT="v$((NUM + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: drivebrain-arm-binary

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            drivebrain-arm

      - name: Tag and push versioned Docker image
        run: |
          docker login -u kkittur -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker pull kkittur/drivebrain_cross_compile:latest
          docker tag kkittur/drivebrain_cross_compile:latest kkittur/drivebrain_cross_compile:${{ steps.version.outputs.tag }}
          docker push kkittur/drivebrain_cross_compile:${{ steps.version.outputs.tag }}
