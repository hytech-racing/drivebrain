services:
  dev:
    build:
      context: .
      target: dev-sim
    image: kkittur/drivebrain_cross_compile
    volumes:
      - conan-cache:/root/.conan2
      - ./:/app
      - /tmp:/tmp
      # - ../HT_proto:/HT_proto
    environment:
      - SIM_HOST=127.0.0.1
    working_dir: /app
    tty: true
    stdin_open: true
    command: sleep infinity
    restart: "no"
    ipc: "host"
    network_mode: "host"

volumes:
  conan-cache:
    
